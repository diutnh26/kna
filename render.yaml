# Render Blueprint — staging for KNĂ.
#
# Deploys the frontend and the API. It does NOT define a database, on
# purpose: Render's own free Postgres expires 30 days after creation, which
# is shorter than a pilot. Provision Neon instead (free permanently, no
# card) and set DATABASE_URL in the Render dashboard.
#
# Full walkthrough: docs/deployment.md

services:
  # ── API ────────────────────────────────────────────────────────────
  - type: web
    name: kna-api
    runtime: node
    plan: free
    region: singapore # closest Render region to Đắk Lắk
    rootDir: .
    # Migrations run here rather than in preDeployCommand, which Render does
    # not support on the free plan. `migrate deploy` only applies pending
    # migrations and is a no-op once they are in, so re-running it on every
    # deploy is safe. It resolves DIRECT_DATABASE_URL via the schema's
    # directUrl, because Neon's pooled endpoint cannot run migrations.
    #
    # The trade-off versus pre-deploy: if the build fails *after* this step,
    # the database is briefly ahead of the running code. Harmless for
    # additive migrations; for a destructive one, apply it by hand first and
    # deploy afterwards.
    buildCommand: npm install && npm run db:generate && npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npm run build:api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_PROVIDER
        value: manual
      # Set in the dashboard — never committed.
      #   DATABASE_URL:        Neon POOLED string (…-pooler.…), ?sslmode=require
      #   DIRECT_DATABASE_URL: Neon DIRECT string (no -pooler), for migrations —
      #                        the pooler is PgBouncer and cannot run them
      #   JWT_SECRET:          32+ chars; `openssl rand -base64 48`
      # The API refuses to start if either is missing or weak
      # (apps/api/src/lib/config.ts).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Points at the static site below, so the two cannot drift apart.
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: kna-web
          property: host

  # ── Frontend ───────────────────────────────────────────────────────
  # No `plan` or `region` here: static sites take neither. They are always
  # free and served from Render's CDN rather than a single region.
  - type: web
    name: kna-web
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      # Baked in at build time by Vite, so a change here needs a rebuild,
      # not just a restart.
      - key: VITE_API_URL
        fromService:
          type: web
          name: kna-api
          property: host
    routes:
      # The app uses a hash router today, so every path serves index.html.
      # Harmless now, and correct already if it moves to real URLs.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
