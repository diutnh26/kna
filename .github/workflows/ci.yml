name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: web — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # package-lock.json is generated on Windows, and npm has a
      # long-standing bug (npm/cli#4828) where a lockfile only records the
      # optionalDependency binding for the platform it was generated on —
      # neither `npm ci` nor a plain `npm install` will then fetch e.g.
      # @rolldown/binding-linux-x64-gnu on this Ubuntu runner, because npm
      # still trusts the lockfile's (wrong-platform) optional-deps entries.
      # Dropping the lockfile before installing forces npm to re-resolve
      # optional deps for the runner it's actually on. Loses install caching
      # and cross-platform reproducibility; worth revisiting once the
      # lockfile is maintained from Linux (e.g. matching prod hosting).
      - run: rm -f package-lock.json && npm install
      - run: npm run lint:web
      - run: npm run build:web

  api:
    name: api — typecheck, migrate & test
    runs-on: ubuntu-latest

    # Real SQL Server, matching development and Azure SQL. Running the
    # suite on SQLite used to hide provider-specific failures — most
    # seriously, SQL Server treats NULLs as equal in a UNIQUE constraint,
    # which silently broke the second marketplace order.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Literal, not ${{ env.* }}: the env context is not available
          # inside a services block. CI-only throwaway credential.
          MSSQL_SA_PASSWORD: "Kna-CI-only-2026!"
        ports:
          - 1433:1433

    env:
      JWT_SECRET: "ci-only"
      DATABASE_URL: "sqlserver://localhost:1433;database=kna_test;user=sa;password=Kna-CI-only-2026!;encrypt=true;trustServerCertificate=true"
      TEST_DATABASE_URL: "sqlserver://localhost:1433;database=kna_test;user=sa;password=Kna-CI-only-2026!;encrypt=true;trustServerCertificate=true"
      MASTER_URL: "sqlserver://localhost:1433;database=master;user=sa;password=Kna-CI-only-2026!;encrypt=true;trustServerCertificate=true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: rm -f package-lock.json && npm install
      - run: npm run db:generate

      # The container accepts TCP before SQL Server finishes starting, so
      # poll with a real query rather than trusting the port.
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            if echo "SELECT 1" | npx prisma db execute --url "$MASTER_URL" --stdin >/dev/null 2>&1; then
              echo "SQL Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "SQL Server did not become ready in 60s"
          exit 1

      # Prisma does not create the database for SQL Server the way it does
      # for SQLite, so it has to exist before migrate runs.
      - name: Create test database
        run: echo "IF DB_ID('kna_test') IS NULL CREATE DATABASE kna_test;" | npx prisma db execute --url "$MASTER_URL" --stdin

      # Applies every migration to a real SQL Server — catches a schema that
      # doesn't migrate cleanly, including the hand-written CHECK
      # constraints and filtered unique indexes.
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run build:api
      - run: npm run test:api
