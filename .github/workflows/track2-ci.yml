name: kna-track2-ci

on:
  push:
    paths:
      - "app/**"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - ".github/workflows/track2-ci.yml"
      - "scripts/**"
      - "docs/**"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/track2-ci.yml"

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      JWT_SECRET: "ci-only-not-a-real-secret-at-least-32-chars"
      DATABASE_URL: "postgresql://postgres:ci-only@localhost:5432/kna_test"
      DIRECT_DATABASE_URL: "postgresql://postgres:ci-only@localhost:5432/kna_test"
      TEST_DATABASE_URL: "postgresql://postgres:ci-only@localhost:5432/kna_test"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: kna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: rm -f package-lock.json && npm install
      - name: Program ID consistency
        run: npm run check:program-id --workspace @kna/chain-client
      - name: Build chain-client
        run: npm run build:chain-client
      - name: Prisma generate + migrate
        run: |
          npm run db:generate
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: API tests
        run: npm run test:api
      - name: Web tests
        run: npm run test:web
      - name: Web production build
        run: npm run build:web
        env:
          VITE_API_URL: https://kna-api.onrender.com
      - name: Chain client tests
        run: npm run test:chain-client

  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anchor SBF build + Rust unit tests
        run: |
          docker build -f Dockerfile.anchor-dev -t kna-anchor .
          docker run --rm \
            -v "${{ github.workspace }}/app:/workspace/app" \
            -v "${{ github.workspace }}/scripts/ci-anchor-build.sh:/ci-anchor-build.sh:ro" \
            kna-anchor bash -lc "sed -i 's/\r$//' /ci-anchor-build.sh && bash /ci-anchor-build.sh"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block keypairs in git
        run: |
          ! git ls-files | grep -E '(keypair\.json|id\.json|\.env\.solana)$' || (echo "Secrets must not be committed" && exit 1)

  mainnet-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install + build API
        run: |
          rm -f package-lock.json
          npm install
          npm run build:chain-client
          npm run db:generate
          npm run build:api
      - name: Mainnet must hard-fail
        run: |
          node -e "
          process.env.SOLANA_CLUSTER='mainnet-beta';
          try {
            const { loadChainConfig } = require('./apps/api/dist/chain/config');
            loadChainConfig();
            console.error('should fail');
            process.exit(1);
          } catch (e) {
            if (!/Mainnet/.test(String(e.message || e))) throw e;
            console.log('ok: mainnet blocked');
          }
          "
