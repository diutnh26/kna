name: kna-track2-ci

on:
  push:
    paths:
      - "app/**"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - ".github/workflows/track2-ci.yml"
      - "scripts/**"
      - "docs/**"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/track2-ci.yml"

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: |
          rm -f package-lock.json
          npm install
      - name: Program ID consistency
        run: npm run check:program-id --workspace @kna/chain-client
      - name: Build chain-client
        run: npm run build:chain-client
      - name: Prisma generate + migrate
        run: |
          npm run db:generate
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://kna:kna@localhost:5432/kna_test
          DIRECT_DATABASE_URL: postgresql://kna:kna@localhost:5432/kna_test
      - name: API tests
        run: npm run test:api
        env:
          DATABASE_URL: postgresql://kna:kna@localhost:5432/kna_test
          DIRECT_DATABASE_URL: postgresql://kna:kna@localhost:5432/kna_test
          TEST_DATABASE_URL: postgresql://kna:kna@localhost:5432/kna_test
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
      - name: Web tests
        run: npm run test:web
      - name: Web production build
        run: npm run build:web
        env:
          VITE_API_URL: https://kna-api.onrender.com
      - name: Chain client tests
        run: npm run test:chain-client

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kna
          POSTGRES_PASSWORD: kna
          POSTGRES_DB: kna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anchor SBF build + Rust unit tests
        run: |
          docker build -f Dockerfile.anchor-dev -t kna-anchor .
          docker run --rm -v "${{ github.workspace }}/app:/workspace/app" kna-anchor bash -lc "
            set -e
            cd /workspace/app
            # IDL host codegen is brittle on modern rustc; SBF binary + committed IDL are the contract.
            anchor build --no-idl
            cargo test -p kna-trust-layer
            test -f packages/chain-client/idl/kna_trust_layer.json
            test -f target/deploy/kna_trust_layer.so || test -f /root/kna-build/target/deploy/kna_trust_layer.so || ls target/deploy || true
          "

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block keypairs in git
        run: |
          ! git ls-files | grep -E '(keypair\.json|id\.json|\.env\.solana)$' || (echo "Secrets must not be committed" && exit 1)

  mainnet-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install + build API
        run: |
          rm -f package-lock.json
          npm install
          npm run build:chain-client
          npm run build:api
      - name: Mainnet must hard-fail
        run: |
          node -e "
          process.env.SOLANA_CLUSTER='mainnet-beta';
          try {
            const { loadChainConfig } = require('./apps/api/dist/chain/config');
            loadChainConfig();
            console.error('should fail');
            process.exit(1);
          } catch (e) {
            if (!/Mainnet/.test(String(e.message || e))) throw e;
            console.log('ok: mainnet blocked');
          }
          "
