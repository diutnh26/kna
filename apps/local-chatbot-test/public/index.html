<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KNĂ — Chatbot Test Bench</title>
<style>
  :root {
    --cream: #f5eddd;
    --red: #c8302e;
    --red-dark: #a82826;
    --bg: #191512;
    --panel: #221d18;
    --bubble-ai: #2c2620;
    --bubble-user: #c8302e;
    --line: rgba(245, 237, 221, 0.12);
    --dim: rgba(245, 237, 221, 0.55);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--cream);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap { width: min(760px, 100%); padding: 16px; display: flex; flex-direction: column; flex: 1; }

  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 4px 16px;
  }
  header h1 { font-size: 18px; letter-spacing: 0.02em; }
  header .tag { font-size: 11px; color: var(--dim); border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; }
  .spacer { flex: 1; }
  .status { font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--dim); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #777; }
  .status.live .dot { background: #4caf50; }
  .status.curated .dot { background: #e6a23c; }
  .status.empty .dot { background: var(--red); }

  .controls { display: flex; gap: 8px; }
  .controls button {
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .controls button.active { color: var(--cream); border-color: var(--cream); }
  .controls button:hover { color: var(--cream); }

  .chat {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    padding: 16px 4px; border-top: 1px solid var(--line);
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-line; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .msg.ai   { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 4px; }
  .msg.quiet { background: transparent; border: 1px dashed var(--line); color: var(--dim); }

  .meta { align-self: flex-start; max-width: 85%; margin-top: -6px; font-size: 11.5px; color: var(--dim); }
  .meta .tier { color: #e6a23c; }
  .meta .tier.A { color: #4caf50; }
  .meta a { color: var(--dim); text-decoration: underline; }

  .typing { align-self: flex-start; display: inline-flex; gap: 4px; padding: 12px 16px; background: var(--bubble-ai); border-radius: 14px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .prompts { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 4px; }
  .prompts button {
    background: var(--panel); color: var(--cream); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; text-align: left;
  }
  .prompts button:hover { border-color: var(--cream); }

  form { display: flex; gap: 10px; padding: 12px 4px 4px; border-top: 1px solid var(--line); }
  form input {
    flex: 1; background: var(--panel); color: var(--cream); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; font-size: 15px; outline: none;
  }
  form input:focus { border-color: var(--dim); }
  form button {
    background: var(--red); color: var(--cream); border: 0; border-radius: 10px;
    padding: 0 22px; font-size: 15px; cursor: pointer;
  }
  form button:hover { background: var(--red-dark); }
  form button:disabled { opacity: 0.35; cursor: not-allowed; }

  footer { padding: 8px 4px 4px; font-size: 11px; color: var(--dim); }
  footer code { color: var(--cream); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>KNĂ Assistant</h1>
    <span class="tag">test bench</span>
    <span class="spacer"></span>
    <span class="status" id="status"><span class="dot"></span><span id="statusText">Đang kiểm tra…</span></span>
    <div class="controls">
      <button id="btnVi" class="active" type="button">VI</button>
      <button id="btnEn" type="button">EN</button>
      <button id="btnNew" type="button" title="Phiên trò chuyện mới">↺</button>
    </div>
  </header>

  <div class="chat" id="chat"></div>
  <div class="prompts" id="prompts"></div>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="Hỏi về văn hoá Ê Đê, homestay, lịch trình…" />
    <button id="send" type="submit">Gửi</button>
  </form>

  <footer>
    API: <code id="apiLabel"></code> — đổi bằng <code>?api=http://localhost:4000</code> ·
    tier A = câu trả lời Hội đồng duyệt (nguyên văn) · B = tổng hợp có trích dẫn [#n] · C = từ chối
  </footer>
</div>

<script>
(() => {
  // Same-origin by default; "?api=http://localhost:4000" points the page at
  // the real API instead — the wire contract is identical.
  const API_BASE = new URLSearchParams(location.search).get("api")?.replace(/\/$/, "") ?? "";
  document.getElementById("apiLabel").textContent = API_BASE || location.origin;

  const T = {
    vi: {
      placeholder: "Hỏi về văn hoá Ê Đê, homestay, lịch trình…",
      send: "Gửi",
      checking: "Đang kiểm tra…",
      live: "Sẵn sàng — Gemini đang hoạt động",
      curated: "Chỉ trả lời câu đã được duyệt (model chưa nối)",
      empty: "Kho tri thức trống — chạy ai:sync",
      offline: "Không nối được API",
      busy: "Trợ lý đang bận — thử lại sau ít phút.",
      failed: "Có lỗi xảy ra. Thử lại nhé.",
      tierA: "Câu trả lời Hội đồng đã duyệt",
      tierB: "Tổng hợp từ nguồn có trích dẫn",
      sources: "Nguồn",
      prompts: [
        "Tôi nên chào người lớn tuổi thế nào?",
        "Cồng Chiêng là gì?",
        "Tôi có thể đặt homestay nào, giá mỗi đêm bao nhiêu?",
        "Tiền của tôi thực sự đi về đâu?",
        "Thủ đô của Pháp là gì?",
      ],
    },
    en: {
      placeholder: "Ask about Ê Đê culture, homestays, itineraries…",
      send: "Send",
      checking: "Checking…",
      live: "Ready — Gemini is answering",
      curated: "Approved answers only (model offline)",
      empty: "Knowledge base empty — run ai:sync",
      offline: "Cannot reach the API",
      busy: "The assistant is busy — try again in a few minutes.",
      failed: "Something went wrong. Please try again.",
      tierA: "Committee-approved answer",
      tierB: "Composed from cited sources",
      sources: "Sources",
      prompts: [
        "How do I greet an elder?",
        "What is Cồng Chiêng?",
        "Which homestays can I book and what do they cost per night?",
        "Where does my money actually go?",
        "What is the capital of France?",
      ],
    },
  };

  let locale = "vi";
  let thinking = false;

  const $ = (id) => document.getElementById(id);
  const chat = $("chat");

  function sessionId() {
    try {
      const key = "kna.test.session";
      let id = localStorage.getItem(key);
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem(key, id);
      }
      return id;
    } catch {
      return crypto.randomUUID();
    }
  }
  let session = sessionId();

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function scroll() { chat.scrollTop = chat.scrollHeight; }

  function addUser(text) { chat.appendChild(el("div", "msg user", text)); scroll(); }

  function addMeta(tier, sources) {
    if (tier !== "A" && tier !== "B") return;
    const t = T[locale];
    const meta = el("div", "meta");
    const badge = el("span", "tier " + tier, tier === "A" ? t.tierA : t.tierB);
    meta.appendChild(badge);
    if (sources?.length) {
      meta.appendChild(document.createTextNode(" · " + t.sources + ": "));
      sources.forEach((s, i) => {
        const a = el("a", null, s.title);
        a.href = s.href || "#";
        a.target = "_blank";
        meta.appendChild(a);
        if (i < sources.length - 1) meta.appendChild(document.createTextNode(", "));
      });
    }
    chat.appendChild(meta);
    scroll();
  }

  // ── SSE client — the proven parser from apps/web/src/lib/api.js ─────
  async function chatStream({ message, onToken, onDone, onError }) {
    const res = await fetch(API_BASE + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, sessionId: session, locale }),
    });
    if (!res.ok || !res.body) {
      const isJson = res.headers.get("content-type")?.includes("application/json");
      const data = isJson ? await res.json().catch(() => null) : null;
      throw new Error(data?.error || "Request failed (" + res.status + ")");
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    const handle = (block) => {
      const event = /event: (\w+)/.exec(block)?.[1];
      const dataLine = block.split("\n").find((l) => l.startsWith("data: "));
      if (!event || !dataLine) return;
      let data;
      try { data = JSON.parse(dataLine.slice(6)); } catch { return; }
      if (event === "token") onToken?.(data.t);
      else if (event === "done") onDone?.(data);
      else if (event === "error") onError?.(data);
    };
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let boundary;
      while ((boundary = buffer.indexOf("\n\n")) !== -1) {
        handle(buffer.slice(0, boundary));
        buffer = buffer.slice(boundary + 2);
      }
    }
  }

  async function send(text) {
    const message = text.trim();
    if (!message || thinking) return;
    thinking = true;
    $("send").disabled = true;
    $("input").value = "";
    addUser(message);

    const typing = el("div", "typing");
    typing.append(el("i"), el("i"), el("i"));
    chat.appendChild(typing);
    scroll();

    let bubble = null;
    let draft = "";
    const t = T[locale];

    const ensureBubble = () => {
      if (!bubble) {
        typing.remove();
        bubble = el("div", "msg ai", "");
        chat.appendChild(bubble);
      }
      return bubble;
    };

    try {
      await chatStream({
        message,
        onToken(tok) {
          draft += tok;
          ensureBubble().textContent = draft;
          scroll();
        },
        onDone(d) {
          // d.answer is AUTHORITATIVE: a draft that failed the grounding
          // check streamed first and is replaced by the refusal here.
          const b = ensureBubble();
          b.textContent = d.answer;
          if (d.tier === "C") b.classList.add("quiet");
          addMeta(d.tier, d.sources);
        },
        onError(e) {
          const b = ensureBubble();
          b.classList.add("quiet");
          b.textContent = e.code === "busy" ? t.busy : t.failed;
        },
      });
    } catch (err) {
      const b = ensureBubble();
      b.classList.add("quiet");
      b.textContent = t.failed + " (" + err.message + ")";
    } finally {
      typing.remove();
      thinking = false;
      $("send").disabled = false;
      $("input").focus();
      scroll();
    }
  }

  // ── Health ──────────────────────────────────────────────────────────
  async function health() {
    const s = $("status");
    const label = $("statusText");
    const t = T[locale];
    s.className = "status";
    label.textContent = t.checking;
    try {
      const res = await fetch(API_BASE + "/chat/health");
      const h = await res.json();
      const docs = (h.documents?.en ?? 0) + (h.documents?.vi ?? 0);
      if (docs === 0) { s.classList.add("empty"); label.textContent = t.empty; }
      else if (h.model) { s.classList.add("live"); label.textContent = t.live; }
      else { s.classList.add("curated"); label.textContent = t.curated; }
    } catch {
      s.classList.add("empty");
      label.textContent = t.offline;
    }
  }

  // ── Locale & prompts ────────────────────────────────────────────────
  function renderPrompts() {
    const box = $("prompts");
    box.innerHTML = "";
    T[locale].prompts.forEach((p) => {
      const b = el("button", null, p);
      b.type = "button";
      b.addEventListener("click", () => send(p));
      box.appendChild(b);
    });
    $("input").placeholder = T[locale].placeholder;
    $("send").textContent = T[locale].send;
  }

  function setLocale(next) {
    locale = next;
    $("btnVi").classList.toggle("active", next === "vi");
    $("btnEn").classList.toggle("active", next === "en");
    renderPrompts();
    health();
  }

  $("btnVi").addEventListener("click", () => setLocale("vi"));
  $("btnEn").addEventListener("click", () => setLocale("en"));
  $("btnNew").addEventListener("click", () => {
    try { localStorage.removeItem("kna.test.session"); } catch {}
    session = sessionId();
    chat.innerHTML = "";
  });

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    send($("input").value);
  });
  // Enter inside a Vietnamese IME composition commits the character — it
  // must not submit the form.
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.isComposing) e.preventDefault();
  });

  renderPrompts();
  health();
})();
</script>
</body>
</html>
